[project]
name = "pierre-sdk"
version = "0.1.0.dev5"
description = "The Pierre SDK for Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=41.0.0",
    "httpx>=0.27.0",
    "typing-extensions>=4.5.0; python_version < '3.11'",
]

[[project.authors]]
name = "Pierre"
email = "support@pierre.co"

[project.urls]
Homepage = "https://pierre.computer"

[dependency-groups]
dev = [
    "mypy>=1.5.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-system"
python-downloads = "never"

[tool.uv.build-backend]
module-name = "pierre"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.10"
strict = true
files = [
    "src",
    "tests",
    "scripts",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "B",
    "C4",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/pierre/_generated/**" = [
    "N803",
    "N815",
]
"tests/**" = [
    "N802",
    "N803",
    "N815",
]
