name: Check SDK build

# Checks a pull request that changes the SDK build: each file against its
# SHA-256 in sdk-build.json, the manifests, the version against the registries,
# and that each package packs and builds. A pull request that changes
# sdk-build.json is a release, and fails when a registry already has its
# version. It needs no secret.

on:
  pull_request:
    branches:
      - main
    paths:
      - sdk-build.json
      - typescript/**
      - cli/**
      - python/**
      - go/**
      - scripts/sdk_build.py
      - .github/workflows/check-sdk-build.yml
      - .github/workflows/publish-sdk.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check the SDK build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check the build and the registries
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          python3 scripts/sdk_build.py check --base "$BASE_SHA"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.plan.outputs.build == 'true'
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: Check the npm packages
        if: steps.plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          for directory in typescript cli; do
            npm pack "./$directory" --dry-run --json --ignore-scripts |
              python3 scripts/sdk_build.py npm-files "$directory"
          done

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.plan.outputs.build == 'true'
        with:
          version: '0.12.23'
          enable-cache: false

      - name: Build and check the Python package
        if: steps.plan.outputs.build == 'true'
        env:
          PYTHON_VERSION: ${{ steps.plan.outputs.python_version }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/python-dist"
          (cd python && uv build --out-dir "$out")
          test -f "$out/pierre_sdk-$PYTHON_VERSION.tar.gz"
          test -f "$out/pierre_sdk-$PYTHON_VERSION-py3-none-any.whl"
          uvx twine==7.0.0 check --strict "$out"/*

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.plan.outputs.build == 'true'
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Build and vet the Go module
        if: steps.plan.outputs.build == 'true'
        working-directory: go
        run: |
          go build ./...
          go vet ./...
